[build]
  command = "npm run build"
  publish = "dist"

# URLs limpas para os estudos de caso (os arquivos reais são .html)
[[redirects]]
  from = "/assistente-de-casa"
  to = "/assistente-de-casa.html"
  status = 200

[[redirects]]
  from = "/pdv-casa-o"
  to = "/pdv-casa-o.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
